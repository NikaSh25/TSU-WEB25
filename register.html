<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | SkillBoost</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="images/header/Logo.png" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="sign-up">
        <div class="sign-up__container">
          <h2 class="sign-up__title">Sign Up</h2>
          <form class="sign-up__form">
            <label class="sign-up__label"
              >First Name
              <input
                type="text"
                class="sign-up__input"
                name="fname"
                placeholder="Enter your first name"
                required
              />
            </label>
            <label class="sign-up__label"
              >Last Name
              <input
                type="text"
                class="sign-up__input"
                name="lname"
                placeholder="Enter your last name"
                required
              />
            </label>
            <label class="sign-up__label"
              >Email
              <input
                type="email"
                class="sign-up__input"
                name="email"
                placeholder="Enter your email"
                required
              />
            </label>
            <label class="sign-up__label"
              >Password
              <input
                type="password"
                class="sign-up__input"
                name="password"
                placeholder="Enter your password"
                required
              />
              <button type="button" class="sign-up__toggle-visibility">
                <img
                  src="images/login/eye-slash.svg"
                  alt="Eye closed"
                  class="sign-up__toggle-img"
                />
              </button>
            </label>
            <button type="submit" class="sign-up__btn">Sign up</button>
          </form>
          <p class="sign-up__signup">
            Already a member?
            <a class="sign-up__register" href="login.html">Log In</a>
          </p>
        </div>
        <img
          src="images/register/register-image.svg"
          alt="Person signing up image"
          class="sign-up__image"
        />
      </section>
    </main>
    <footer></footer>
    <!-- <script src="/js/script.js"></script> -->
    <script src="/js/login.js"></script>
  </body>
</html>
